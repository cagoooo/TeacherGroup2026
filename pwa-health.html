<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#063b84">
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <title>PWA 與離線狀態｜桃園市教育產業工會</title>
    <style>
      :root { color-scheme: light; font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; color: #17233a; background: #fffaf0; }
      body { margin: 0; padding: 32px 18px; }
      main { width: min(680px, 100%); margin: 0 auto; padding: 30px; border: 1px solid #d8e0eb; border-radius: 22px; background: #fff; box-shadow: 0 14px 34px rgba(7, 40, 90, .1); }
      a { color: #063b84; font-weight: 800; }
      h1 { color: #063b84; line-height: 1.3; }
      .status { padding: 14px 16px; border-left: 4px solid #168657; background: #eaf8ef; }
      dl { display: grid; grid-template-columns: minmax(150px, .45fr) minmax(0, 1fr); gap: 0; margin: 24px 0; }
      dt, dd { padding: 12px 0; border-top: 1px solid #d8e0eb; }
      dt { color: #516078; font-weight: 800; }
      dd { margin: 0; font-family: ui-monospace, "Cascadia Mono", monospace; overflow-wrap: anywhere; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      button, .button { display: inline-flex; min-height: 42px; align-items: center; justify-content: center; padding: 9px 14px; border: 1px solid #063b84; border-radius: 9px; color: #fff; background: #063b84; font: inherit; font-weight: 800; text-decoration: none; cursor: pointer; }
      .button.secondary { color: #063b84; background: #fff; }
      button:focus-visible, a:focus-visible { outline: 3px solid #f4b622; outline-offset: 3px; }
      .note { color: #516078; font-size: .9rem; line-height: 1.65; }
      @media (max-width: 520px) { main { padding: 23px; } dl { grid-template-columns: 1fr; } dd { padding-top: 0; border-top: 0; } }
    </style>
  </head>
  <body>
    <main>
      <p><a href="./">← 回到會員服務首頁</a></p>
      <h1>網站 PWA 與離線狀態</h1>
      <p class="status" id="network-status" role="status">正在檢查目前連線與快取狀態……</p>
      <dl>
        <dt>目前公開版本</dt><dd id="server-version">讀取中</dd>
        <dt>頁面建置版本</dt><dd id="page-version">2026.09.08-1</dd>
        <dt>Service Worker</dt><dd id="sw-status">檢查中</dd>
        <dt>最後檢查時間</dt><dd id="checked-at">尚未完成</dd>
      </dl>
      <div class="actions">
        <button type="button" id="check-update">重新檢查版本</button>
        <a class="button secondary" href="./">回首頁</a>
      </div>
      <p class="note">本頁只檢查網站版本、連線與本機 Service Worker 狀態，不收集會員姓名、電話、名冊、付款資料或第三方追蹤資訊。若網路暫時中斷，Service Worker 會嘗試提供最近一次可用的網站內容。</p>
    </main>
    <script>window.SITE_VERSION = '2026.09.08-2';</script>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const formatTime = () => new Intl.DateTimeFormat('zh-TW', { dateStyle: 'medium', timeStyle: 'medium' }).format(new Date());
        const check = async () => {
          $('network-status').textContent = navigator.onLine ? '目前已連線；可以檢查最新版本。' : '目前為離線狀態；以下資訊來自本機快取。';
          $('checked-at').textContent = formatTime();
          $('page-version').textContent = window.SITE_VERSION;
          try {
            const response = await fetch(`./version.json?t=${Date.now()}`, { cache: 'no-store' });
            const data = await response.json();
            $('server-version').textContent = data.version || '未提供';
          } catch {
            $('server-version').textContent = '離線，無法查詢';
          }
          if (!('serviceWorker' in navigator)) {
            $('sw-status').textContent = '瀏覽器不支援';
            return;
          }
          try {
            const registration = await navigator.serviceWorker.getRegistration('./');
            if (!registration) {
              $('sw-status').textContent = '尚未註冊';
              return;
            }
            $('sw-status').textContent = navigator.serviceWorker.controller ? '已接管本頁，可使用離線備援' : '已註冊，等待接管';
            if (registration.active) registration.active.postMessage({ type: 'GET_VERSION' });
            if (navigator.onLine) await registration.update().catch(() => {});
          } catch {
            $('sw-status').textContent = '檢查失敗';
          }
        };
        navigator.serviceWorker?.addEventListener('message', (event) => {
          if (event.data?.type === 'SW_VERSION') $('sw-status').textContent = `已接管本頁，可使用離線備援｜快取 ${event.data.version}`;
        });
        $('check-update').addEventListener('click', check);
        window.addEventListener('online', check);
        window.addEventListener('offline', check);
        check();
      })();
    </script>
  </body>
</html>
